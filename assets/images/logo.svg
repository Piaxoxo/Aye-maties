<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#012a4a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c060"/>
      <stop offset="100%" stop-color="#c4820a"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="circle"><circle cx="210" cy="210" r="195"/></clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="210" cy="210" r="198" fill="url(#bgGrad)" stroke="#c4820a" stroke-width="3"/>
  <circle cx="210" cy="210" r="188" fill="none" stroke="rgba(196,130,10,0.35)" stroke-width="1"/>

  <!-- Ship's wheel (background) -->
  <g opacity="0.22" transform="translate(210,185)">
    <circle r="72" fill="none" stroke="#d4a84b" stroke-width="6"/>
    <circle r="20" fill="none" stroke="#d4a84b" stroke-width="5"/>
    <line x1="0" y1="-72" x2="0" y2="-20" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="72" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="-72" y1="0" x2="-20" y2="0" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="72" y2="0" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="-50.9" y1="-50.9" x2="-14.1" y2="-14.1" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="14.1" y1="14.1" x2="50.9" y2="50.9" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="50.9" y1="-50.9" x2="14.1" y2="-14.1" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
    <line x1="-14.1" y1="14.1" x2="-50.9" y2="50.9" stroke="#d4a84b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Foliage left -->
  <g opacity="0.7" fill="#3a7a3a">
    <ellipse cx="95" cy="120" rx="22" ry="10" transform="rotate(-40,95,120)"/>
    <ellipse cx="75" cy="145" rx="20" ry="9" transform="rotate(-55,75,145)"/>
    <ellipse cx="68" cy="105" rx="18" ry="8" transform="rotate(-25,68,105)"/>
    <ellipse cx="115" cy="95" rx="16" ry="7" transform="rotate(-60,115,95)"/>
  </g>
  <!-- Foliage right -->
  <g opacity="0.7" fill="#3a7a3a">
    <ellipse cx="325" cy="120" rx="22" ry="10" transform="rotate(40,325,120)"/>
    <ellipse cx="345" cy="145" rx="20" ry="9" transform="rotate(55,345,145)"/>
    <ellipse cx="352" cy="105" rx="18" ry="8" transform="rotate(25,352,105)"/>
    <ellipse cx="305" cy="95" rx="16" ry="7" transform="rotate(60,305,95)"/>
  </g>

  <!-- Crossed sabers -->
  <!-- Left saber (blade: top-right to bottom-left) -->
  <g filter="url(#glow)">
    <line x1="90" y1="85" x2="310" y2="200" stroke="#c8c0b0" stroke-width="5" stroke-linecap="round"/>
    <rect x="82" y="78" width="18" height="12" rx="3" fill="#d4a84b"/>
    <!-- Right saber -->
    <line x1="330" y1="85" x2="110" y2="200" stroke="#c8c0b0" stroke-width="5" stroke-linecap="round"/>
    <rect x="320" y="78" width="18" height="12" rx="3" fill="#d4a84b"/>
  </g>

  <!-- Skull -->
  <g transform="translate(210,155)">
    <!-- Pirate hat -->
    <path d="M-62,-40 Q-10,-80 62,-40 L50,-38 Q0,-68 -50,-38 Z" fill="#1a1008" stroke="#d4a84b" stroke-width="1.5"/>
    <rect x="-68" y="-44" width="136" height="14" rx="7" fill="#1a1008" stroke="#d4a84b" stroke-width="1.2"/>
    <!-- Hat cockade / skull decoration on hat -->
    <circle cx="0" cy="-52" r="12" fill="#c8c0b0" stroke="#1a1008" stroke-width="1"/>
    <circle cx="0" cy="-52" r="5" fill="#1a1008"/>
    <!-- Red bandana at hat base -->
    <path d="M-55,-30 Q0,-22 55,-30 L50,-26 Q0,-18 -50,-26 Z" fill="#8b1a1a"/>
    <!-- Cranium -->
    <ellipse cx="0" cy="0" rx="52" ry="48" fill="#d4ccbc" stroke="#a09080" stroke-width="1"/>
    <!-- Cheekbones -->
    <ellipse cx="-28" cy="20" rx="16" ry="10" fill="#c4baa8"/>
    <ellipse cx="28" cy="20" rx="16" ry="10" fill="#c4baa8"/>
    <!-- Eye sockets -->
    <ellipse cx="-18" cy="-5" rx="14" ry="13" fill="#1a0d05"/>
    <ellipse cx="18" cy="-5" rx="14" ry="13" fill="#1a0d05"/>
    <!-- Monocle on left eye -->
    <circle cx="-18" cy="-5" r="16" fill="none" stroke="#d4a84b" stroke-width="1.5"/>
    <!-- Nose -->
    <path d="M-6,16 Q0,22 6,16" stroke="#8a7a68" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Mouth / teeth -->
    <path d="M-24,32 Q0,44 24,32" fill="none" stroke="#7a6a58" stroke-width="2"/>
    <line x1="-12" y1="32" x2="-12" y2="40" stroke="#d4ccbc" stroke-width="3"/>
    <line x1="0" y1="34" x2="0" y2="43" stroke="#d4ccbc" stroke-width="3"/>
    <line x1="12" y1="32" x2="12" y2="40" stroke="#d4ccbc" stroke-width="3"/>
  </g>

  <!-- Main banner ribbon -->
  <path d="M50,248 Q70,238 210,242 Q350,238 370,248 L360,278 Q340,270 210,274 Q80,270 60,278 Z" fill="#1a0c04" stroke="#d4a84b" stroke-width="1.5"/>
  <!-- Banner tails -->
  <path d="M50,248 L30,264 L55,270 L60,278 Z" fill="#120804"/>
  <path d="M370,248 L390,264 L365,270 L360,278 Z" fill="#120804"/>

  <!-- "Aye Maties" text on banner -->
  <text x="210" y="272" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,serif" font-size="38" font-style="italic" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">Aye Maties</text>

  <!-- Sub-banner: PIRATE CHALLENGE -->
  <path d="M80,285 Q210,280 340,285 L336,305 Q210,300 84,305 Z" fill="#0a1628" stroke="rgba(196,130,10,0.5)" stroke-width="1"/>
  <text x="210" y="299" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#d4a84b" letter-spacing="4">PIRATE CHALLENGE</text>

  <!-- SAVING OUR OCEANS -->
  <text x="210" y="320" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#7aacbe" letter-spacing="4.5">SAVING OUR OCEANS</text>

  <!-- Ocean waves at bottom -->
  <g clip-path="url(#circle)" opacity="0.6">
    <path d="M15,345 Q60,332 105,345 Q150,358 195,345 Q240,332 285,345 Q330,358 375,345 Q400,338 405,342 L405,405 L15,405 Z" fill="#0a3d5c"/>
    <path d="M15,358 Q70,344 125,358 Q180,372 235,358 Q290,344 345,358 Q380,350 405,355 L405,420 L15,420 Z" fill="#062a40" opacity="0.8"/>
  </g>

  <!-- Compass rose at bottom center -->
  <g transform="translate(210,355)" filter="url(#glow)">
    <circle r="22" fill="rgba(1,10,20,0.7)" stroke="#d4a84b" stroke-width="1"/>
    <polygon points="0,-18 2,0 0,3 -2,0" fill="#d4a84b"/>
    <polygon points="0,18 2,0 0,-3 -2,0" fill="#7aacbe"/>
    <polygon points="-18,0 0,-2 3,0 0,2" fill="rgba(212,168,75,0.5)"/>
    <polygon points="18,0 0,-2 -3,0 0,2" fill="rgba(212,168,75,0.5)"/>
    <circle r="3" fill="#d4a84b"/>
    <text x="0" y="-22" text-anchor="middle" font-size="7" fill="#d4a84b" font-family="Georgia,serif">N</text>
  </g>

  <!-- Outer decorative ring -->
  <circle cx="210" cy="210" r="198" fill="none" stroke="#d4a84b" stroke-width="2.5" opacity="0.8"/>
  <circle cx="210" cy="210" r="193" fill="none" stroke="rgba(196,130,10,0.2)" stroke-width="1"/>
</svg>
